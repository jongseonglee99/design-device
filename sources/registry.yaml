# ─── 샘플링 정책 ───────────────────────────────────────────────────────────
sampling:
  per_source: [3, 5]              # 라운드당 소스별 3~5개 (총 15~25)
  studio_cooldown_weeks: 4        # 같은 스튜디오·작가는 4주 재관측 금지.
                                  # 한 곳의 하우스 스타일이 반복 승격되는 것을 막는다.
  counterexample_per_round: 1     # 매 라운드 의도적 반례 1개.
                                  # 없으면 확증편향으로 자산이 한 방향으로 굳는다.
  counterexample_source: user     # 반례는 사용자가 고른다 — 내가 고르면 내 기준이 반영돼
                                  # 반례 역할이 약해진다.
  category_preference: [tool, dashboard, saas, b2b]  # 있으면 우선. 보조 기준일 뿐
                                                     # (이 사이트들엔 해당 물량이 적다)

# ─── 커버리지 축 ───────────────────────────────────────────────────────────
coverage:
  covered:
    - 모션·인터랙션          # awwwards
    - 타이포·색 시스템        # siteinspire, notefolio
    - 비서구권 시각언어       # gdweb, notefolio  (잘 커버됨)
    - 프로덕트 UI 실물·플로우  # mobbin (2026-08-18 추가)
    - 디자인 시스템 규모 캘리브레이션  # designsystems-surf (2026-08-18)
    - 플랫폼 HIG                # apple-hig, material3 (분기 + 이벤트)
    - 포화 선행 지표             # uidatabase (역할: NEGATIVE)
    - 실무 판단·트레이드오프(L8)  # madia-uxui (2026-10-03). 유일한 구술 소스
  gaps:
    - 프로덕트 모션           # mobbin은 정적. Awwwards는 마케팅 사이트. Page Flows 보류 중.
                            # 현재 유일한 실질 공백
    - 접근성·크래프트         # 소스가 아니라 검사기로 메운다 (scripts/contrast-check.mjs + axe)
